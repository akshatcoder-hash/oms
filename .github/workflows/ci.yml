name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Install the pinned Surfpool
        run: node packages/cli/src/bin.ts doctor --install || true

      - name: Test
        run: |
          export SURFPOOL_BINARY="$(ls -d "$HOME"/.oms/tools/surfpool-*/surfpool | head -1)"
          npm test

  package:
    name: Build and smoke-test the npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Build the release archive
        run: npm run pack:release

      - name: Install into a clean directory and run it
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/.tmp/release/barestate-oms-*.tgz --ignore-scripts --no-audit --no-fund
          npx --no-install oms --version
          npx --no-install oms --help
