[package]
name = "oms-sast"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde"] }
semver = "=1.0.28"
